<!-- HospitalSystem/templates/evaluate_doctor.html -->
<!DOCTYPE html>
{% load static %}
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评价医生</title>
    <link rel="stylesheet" href="{% static 'css/patientcenter.css' %}">
    <link rel="stylesheet" href="{% static 'css/evaluate_doctor.css' %}">
</head>

<body>
    <div class="main-container">
        <h1>评价医生</h1>
        <div class="appointment-info">
            <p><strong>医生姓名:</strong> {{ register.doctor.name }}</p>
            <p><strong>挂号时间:</strong> {{ register.registration_time }}</p>
            <p><strong>预约时间:</strong> {{ register.consultation_hours }}</p>
            <p><strong>状态:</strong> {{ register.status }}</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="service_attitude">服务态度评分 (1 - 5 分):</label>
                <select name="service_attitude" id="service_attitude">
                    {% for i in rating_range %}
                        <option value="{{ i }}">{{ i }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="professional_level">专业水平评分 (1 - 5 分):</label>
                <select name="professional_level" id="professional_level">
                    {% for i in rating_range %}
                        <option value="{{ i }}">{{ i }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="comment">评价内容:</label>
                <textarea name="comment" id="comment" rows="4"></textarea>
            </div>
            <div class="button-group">
                <input type="submit" class="button submit-button" value="提交评价">
                <!-- 修改此处 -->
                <a href="{% url 'patient_evaluation_records' %}" class="button back-button">返回评价页面</a>
            </div>
        </form>
    </div>
</body>

</html>
