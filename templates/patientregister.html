<!DOCTYPE html>
{% load static %}
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>患者注册</title>
    <link rel="stylesheet" href="{% static 'css/patientregister.css' %}">
    <script>
        window.onload = function () {
            var errorMessage = document.querySelector('.error-message');
            if (errorMessage) {
                setTimeout(function () {
                    errorMessage.style.display = 'none';
                }, 3000);
            }
        };

        function validateForm() {
            var phone = document.forms["register_form"]["phone"].value;
            var password = document.forms["register_form"]["password"].value;
            var confirm_password = document.forms["register_form"]["confirm_password"].value;
            var name = document.forms["register_form"]["name"].value;
            var sex = document.forms["register_form"]["sex"].value;
            var age = document.forms["register_form"]["age"].value;

            // 检查所有字段是否为空
            if (!phone || !password || !confirm_password || !name || !sex || !age) {
                alert("请填写所有字段");
                return false;
            }

            var phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                alert("请输入有效的手机号码");
                return false;
            }

            if (password.length < 6) {
                alert("密码长度不能少于6位");
                return false;
            }

            if (password !== confirm_password) {
                alert("两次输入的密码不一致，请重新输入");
                return false;
            }

            var nameRegex = /^[a-zA-Z\u4e00-\u9fa5]+$/;
            if (!nameRegex.test(name)) {
                alert("患者姓名只能包含英文和中文");
                return false;
            }

            if (sex === "") {
                alert("请选择患者性别");
                return false;
            }

            var ageRegex = /^\d{1,3}$/;
            if (!ageRegex.test(age)) {
                alert("请输入有效的年龄");
                return false;
            }

            return true;
        }
    </script>
</head>

<body>
    <div class="register_container">
        <div class="logo_box">
            <img class="logo_img" src="/static/images/patient.png" />
        </div>
        <form class="register_form" method="POST" action="/patientregister/" onsubmit="return validateForm();">
            <h1 class="title">欢迎注册，开启健康之旅</h1>
            {% csrf_token %}
            <input class="input_box" type="text" name="phone" placeholder="电话" />
            <input class="input_box" type="password" name="password" placeholder="密码" />
            <input class="input_box" type="password" name="confirm_password" placeholder="确认密码" />
            <input class="input_box" type="text" name="name" placeholder="患者姓名" />
            <select class="input_box" name="sex">
                <option value="">请选择性别</option>
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
            <input class="input_box" type="text" name="age" placeholder="患者年龄" />

            <!-- 显示错误信息 -->
            {% if err %}
            <p class="error-message">{{ tips }}</p>
            {% endif %}
            <input class="button_box" type="submit" value="注册" />
            <a href="/patientlogin/" class="link_button">返回登录</a>
        </form>
    </div>
</body>

</html>
