<!DOCTYPE html>
{% load static %}
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>患者信息修改</title>
    <link rel="stylesheet" href="{% static 'css/patientregister.css' %}">
</head>

<body>
    <div class="register_container">
        <div class="logo_box">
            <img class="logo_img" src="/static/images/patient.png" />
        </div>
        <form class="register_form" method="POST" action="/patientupdateinfo/">
            <h1 class="title">修改患者信息</h1>
            {% csrf_token %}
            {% if error %}
            <p class="error-message">{{ error }}</p>
            {% endif %}
            <input class="input_box" type="text" name="phone" placeholder="电话" value="{{ patient.phone }}" />
            <input class="input_box" type="password" name="password" placeholder="新密码（不修改留空）" />
            <input class="input_box" type="text" name="name" placeholder="患者姓名" value="{{ patient.name }}" />
            <select class="input_box" name="sex">
                <option value="男" {% if patient.sex == '男' %}selected{% endif %}>男</option>
                <option value="女" {% if patient.sex == '女' %}selected{% endif %}>女</option>
            </select>
            <input class="input_box" type="text" name="age" placeholder="年龄" value="{{ patient.age }}" />
            <input class="button_box" type="submit" value="保存修改" />
            <a href="/patientcenter/" class="link_button">返回</a>
        </form>
    </div>
</body>

</html>
